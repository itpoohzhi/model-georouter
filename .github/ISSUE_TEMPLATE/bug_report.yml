name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Actual behavior, expected behavior, logs or traceback.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce?
      description: Minimal config and steps.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version (`python --version`), commit or tag.
    validations:
      required: true
