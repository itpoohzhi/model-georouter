[project]
name = "model-georouter"
version = "1.0.0"
description = "Non-political, zero-dependency L7 proxy & multi-proxy geo-router for unrestricted, borderless AI model access (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
