[project]
name = "model-georouter"
version = "1.0.0"
description = "High-performance L7 HTTP/SSE Proxy & Multi-Proxy Geo-Router for AI Models (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
